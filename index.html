<!DOCTYPE html>
<html>

<head>
    <!-- This is the title shown in the browser tab -->
    <title>Hello World Button</title>
</head>

<body>

    <!-- This button runs the code when clicked -->
    <button onclick="document.getElementById('output').innerHTML = 'Hello World!'">
        Click me!
    </button>

    <!-- This is where "Hello World!" will appear -->
    <div id="output"></div>

</body>

</html>
